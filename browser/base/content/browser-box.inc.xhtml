<hbox flex="1" id="browser">
  <box context="sidebar-context-menu" id="sidebar-container" hidden="true">
    <html:sidebar-main flex="1">
      <box id="vertical-tabs" slot="tabstrip" customizable="true" contextmenu="toolbar-context-menu"></box>
    </html:sidebar-main>
  </box>
  <splitter id="sidebar-launcher-splitter" class="chromeclass-extrachrome sidebar-splitter" resizebefore="sibling" resizeafter="none" hidden="true"/>
  <vbox id="sidebar-box" hidden="true" class="chromeclass-extrachrome">
    <box id="sidebar-header" align="center">
      <toolbarbutton id="sidebar-switcher-target" class="tabbable" aria-expanded="false">
        <image id="sidebar-icon" consumeanchor="sidebar-switcher-target"/>
        <label id="sidebar-title" crop="end" control="sidebar"/>
        <image id="sidebar-switcher-arrow"/>
      </toolbarbutton>
      <image id="sidebar-throbber"/>
      <spacer id="sidebar-spacer"/>
      <toolbarbutton id="sidebar-close" class="close-icon tabbable" data-l10n-id="sidebar-close-button"/>
    </box>
    <stack class="sidebar-browser-stack">
      <browser id="sidebar" autoscroll="false" disablehistory="true" disablefullscreen="true" tooltip="aHTMLTooltip"/>
    </stack>
  </vbox>
  <splitter id="sidebar-splitter" class="chromeclass-extrachrome sidebar-splitter" resizebefore="sibling" resizeafter="none" hidden="true" role="separator" aria-controls="sidebar-box" data-l10n-id="sidebar-resize-splitter"/>
  <tabbox id="tabbrowser-tabbox" flex="1" tabcontainer="tabbrowser-tabs">
    <tabpanels id="tabbrowser-tabpanels" flex="1" selectedIndex="0"/>
  </tabbox>
  <splitter id="ai-window-splitter" class="chromeclass-extrachrome sidebar-splitter" resizebefore="sibling" resizeafter="sibling" collapsed="true"/>
  <vbox id="ai-window-box" collapsed="true" class="chromeclass-extrachrome ai-window-right-sidebar">
    <stack class="ai-window-browser-stack" flex="1">
    </stack>
  </vbox>
</hbox>

<splitter id="browser-terminal-splitter"
          class="chromeclass-extrachrome"
          orient="vertical"
          resizebefore="none"
          resizeafter="sibling"
          collapsed="true"
          role="separator"
          aria-controls="browser-terminal-panel"
          data-l10n-id="browser-terminal-splitter"/>

<vbox id="browser-terminal-panel"
      class="chromeclass-extrachrome"
      collapsed="true"
      role="region"
      aria-labelledby="browser-terminal-title">
  <hbox id="browser-terminal-header" align="center">
    <label id="browser-terminal-title" data-l10n-id="browser-terminal-panel-title"/>
    <spacer flex="1"/>
    <toolbarbutton id="browser-terminal-close-button"
                   class="close-icon"
                   command="cmd_toggleTerminalPanel"
                   data-l10n-id="browser-terminal-close-button"/>
  </hbox>
  <html:div id="browser-terminal-output" role="log" aria-live="polite" aria-relevant="additions text"></html:div>
  <hbox id="browser-terminal-input-row" align="center">
    <label id="browser-terminal-prompt" value=">"/>
    <html:input id="browser-terminal-input" type="text" data-l10n-id="browser-terminal-input"/>
  </hbox>
</vbox>
